name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La version de pnpm vient du champ "packageManager" de package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Garde-fou anti-fuite (J5, spec §6) : build puis scan du bundle client et des variables publiques.
      # Variables publiques factices : le build pré-rend des pages qui valident l'environnement client
      # (J8). Aucun secret : ce sont des valeurs de placeholder, jamais utilisées pour se connecter.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
      - run: pnpm check:leaks --require-bundle

  database:
    name: supabase (pgTAP, schema lint, RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pile minimale (base, auth, API) : suffisante pour les tests SQL et les tests RLS via PostgREST.
      - name: Démarrer Supabase local
        run: >
          pnpm db:start -x
          studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api,postgres-meta,supavisor

      - run: pnpm db:reset
      - name: Tests SQL pgTAP (contraintes, fonctions d'aide, schema lint)
        run: pnpm test:db
      - name: Tests RLS via la Data API (matrice utilisateur x entreprise x opération)
        run: pnpm test:rls
