name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La version de pnpm vient du champ "packageManager" de package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Garde-fou anti-fuite (J5, spec §6) : build puis scan du bundle client et des variables publiques.
      - run: pnpm build
      - run: pnpm check:leaks --require-bundle
      # J7 ajoutera : supabase start + pnpm db:reset + pnpm test:rls + schema lint.
